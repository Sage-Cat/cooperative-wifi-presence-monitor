" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="75.4038" x="267" y="317.0669">One worker</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="116.1621" x="267" y="332.1997">inference adapter</text></g><!--entity Writer--><g class="entity" data-qualified-name="Outer Linux runtime.Writer" data-source-line="14" id="ent0006"><rect fill="#F1F1F1" height="35.1328" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="143.7031" x="554" y="302.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="123.7031" x="564" y="324.5669">Atomic JSON writer</text></g><!--entity Source--><g class="entity" data-qualified-name="Source" data-source-line="9" id="ent0001"><rect fill="#F1F1F1" height="35.1328" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="161.8257" x="7" y="41"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="141.8257" x="17" y="63.0669">Observation producer</text></g><!--entity Monitor--><g class="entity" data-qualified-name="Monitor" data-source-line="16" id="ent0007"><rect fill="#DCEAF6" height="50.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="248.6426" x="794.5" y="295"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="108.7544" x="804.5" y="317.0669">PresenceMonitor</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="228.6426" x="804.5" y="332.1997">coordinator + one pending window</text></g><!--entity Domain--><g class="entity" data-qualified-name="Domain" data-source-line="17" id="ent0008"><rect fill="#E2F3E9" height="50.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="293.1714" x="772.5" y="424"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="147.9829" x="782.5" y="446.0669">Domain values + rules</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="273.1714" x="782.5" y="461.1997">window, qualification, current-state policy</text></g><!--entity Consumer--><g class="entity" data-qualified-name="Consumer" data-source-line="18" id="ent0009"><rect fill="#F1F1F1" height="50.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="189.0952" x="531.5" y="424"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="102.4131" x="541.5" y="446.0669">Local consumer</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="169.0952" x="541.5" y="461.1997">independent expiry check</text></g><!--link Source to Decoder--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="19" id="lnk10"><path d="M169.06,58.5 C214.97,58.5 266.61,58.5 309.48,58.5" fill="none" id="Source-to-Decoder" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="314.48,58.5,305.48,54.5,309.48,58.5,305.48,62.5,314.48,58.5" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="108.5894" x="187.75" y="51.5669">one local stream</text></g><!--link Decoder to Runner--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="20" id="lnk11"><path d="M379.14,76.09 C379.31,96.08 379.5586,124.8302 379.7486,147.7502" fill="none" id="Decoder-to-Runner" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="379.79,152.75,383.7153,143.7172,379.7486,147.7502,375.7155,143.7835,379.79,152.75" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="118.878