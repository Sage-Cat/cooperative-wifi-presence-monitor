><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" data-link-type="dependency" data-source-line="26" id="lnk17"><path d="M626,337.6 C626,359.52 626,393.28 626,418.56" fill="none" id="Writer-to-Consumer" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="626,423.56,630,414.56,626,418.56,622,414.56,626,423.56" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="132.8691" x="627" y="390.0669">one atomic JSON file</text></g><g class="legend" data-source-line="27"><rect fill="none" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="481.1875" x="295.7419" y="494.2656"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="471.1875" x="300.7419" y="512.2607">Runtime flow; boxes are responsibilities, not interfaces or services.</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="413.6563" x="300.7419" y="528.5576">Coordinator never calls the worker, clock or writer directly.</text></g></g></svg>