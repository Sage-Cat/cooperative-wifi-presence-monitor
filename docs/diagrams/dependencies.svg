<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="534px" preserveAspectRatio="none" style="width:751px;height:534px;background:#FFFFFF;" version="1.1" viewBox="0 0 751 534" width="751px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><!--entity Root--><g class="entity" data-qualified-name="Root" data-source-line="9" id="ent0001"><rect fill="#F1F5F9" height="50.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="259.6875" x="210" y="7"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="148.897" x="220" y="29.0669">Linux composition root</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="239.6875" x="220" y="44.1997">main, clock, I/O and bounded worker</text></g><!--entity Adapters--><g class="entity" data-qualified-name="Adapters" data-source-line="10" id="ent0002"><rect fill="#E6F0FA" height="50.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="397.5903" x="7" y="134"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="120.6372" x="17" y="156.0669">Concrete adapters</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="377.5903" x="17" y="171.1997">NDJSON decoder | inference backend | atomic JSON writer</text></g><!--entity Application--><g class="entity" data-qualified-name="Application" data-source-line="11" id="ent0003"><rect fill="#DCEAF6" height="65.3984" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="329.8735" x="181" y="261"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="72.6362" x="191" y="283.0669">Application</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="309.8735" x="191" y="298.1997">PresenceMonitor + plain job/outcome contracts</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="239.0527" x="191" y="313.3325">Owns the inference callable contract</text></g><!--entity Domain--><g class="entity" data-qualified-name="Domain" data-source-line="12" id="ent0004"><rect fill="#E2F3E9" height="50.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="349.1323" x="171.5" y="403"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="50.4448" x="181.5" y="425.0669">Domain</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="329.1323" x="181.5" y="440.1997">Plain values + pure evidence, time and state rules</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="18" id="ent0010"><path d="M556,408 L556,424 L520.61,428 L556,432 L556,448.2656 A0,0 0 0 0 556,448.2656 L736.2119,448.2656 A0,0 0 0 0 736.2119,448.2656 L736.2119,418 L726.2119,408 L556,408 A0,0 0 0 0 556,408" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M726.2119,408 L726.2119,418 L736.2119,418 L726.2119,408" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="159.2119" x="562" y="425.0669">No Linux, JSON, threads,</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="154.7368" x="562" y="440.1997">backend handles or I/O.</text></g><!--link Root to Adapters--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="13" id="lnk5"><path d="M314.16,57.1 C290.44,79.24 259.116,108.4492 235.416,130.5592" fill="none" id="Root-to-Adapters" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="231.76,133.97,241.0695,130.7555,235.416,130.5592,235.6123,124.9058,231.76,133.97" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="100.6802" x="283" y="100.0669">wires and owns</text></g><!--link Root to Application--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk6"><path d="M365.07,57.13 C373.96,66.17 383.79,76.74 392,87 C431.12,135.89 441.83,152.39 453,214 C454.35,221.43 456.78,224.46 453,231 C446.08,242.96 439.9401,249.924 428.5201,257.954" fill="none" id="Root-to-Application" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="424.43,260.83,434.0929,258.9253,428.5201,257.954,429.4914,252.3812,424.43,260.83" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="158.3931" x="447" y="163.5669">calls with explicit values</text></g><!--link Adapters to Application--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M207.94,184.29 C210.24,199.17 215.21,217.82 226,231 C235.79,242.96 244.2092,250.2731 257.6992,258.3431" fill="none" id="Adapters-to-Application" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="261.99,260.91,256.32,252.857,257.6992,258.3431,252.213,259.7223,261.99,260.91" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="221.7998" x="227" y="227.0669">uses / implements inner contracts</text></g><!--link Application to Domain--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M346,326.24 C346,349.82 346,376.49 346,397.99" fill="none" id="Application-to-Domain" style="stroke:#334155;stroke-width:1;"/><polygon fill="#334155" points="346,402.99,350,393.99,346,397.99,342,393.99,346,402.99" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="82.564" x="347" y="369.0669">applies rules</text></g><g class="legend" data-source-line="21"><rect fill="none" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="274.4346" x="234.8887" y="473.2656"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="247.0713" x="239.8887" y="491.2607">Source dependencies point inward.</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="264.4346" x="239.8887" y="507.5576">Runtime data flow is a separate view.</text></g></g></svg>