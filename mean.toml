schema_version = 1
mean_id = "cooperative_wifi_presence_monitor"
canonical_name = "Cooperative Wi-Fi Presence Monitor"
implementation_surface = "."

[practical_contract]
implementation_kind = "software (design only)"
practical_task = "Publish a read-only zone-level present, absent, or unknown estimate from integrity-checked cooperative Wi-Fi source windows, with separate evidence validity, age, domain eligibility, and provenance."
usable_result = "Planned: a versioned current-result record with a conservative validity horizon and a separately identified last-known historical estimate; currently: design specification only, with no executable result."
intended_user = "Authorized operator of an indoor cooperative Wi-Fi sensing setup."
application_route = "Proposed C++17 portable core with a POSIX Linux service adapter; collector and CWS outputs are consumed read-only. No runtime is implemented or installable yet."
inputs = ["Collector-owned cws-source-record/2 records; legacy v1 records only with absent facts left unknown", "Frozen and hash-verified feature-pipeline and model bundle", "Explicit domain/profile configuration", "Optional read-only CWS network and service context"]
outputs = ["Versioned current presence result: present, absent, or unknown", "Separate evidence-validity, domain-eligibility, age-bound, and expiration fields", "Model, pipeline, source-window, and configuration provenance", "Last-known result retained as historical context only"]
exclusions = ["CSI acquisition and raw-record ownership", "Firmware measurement-rate transactions and acknowledgement authority", "AQ-MC/SACM policy or other sensing-rate decisions", "Access-point, channel, association, routing, QoS, or traffic mutation", "Person identity, exact location, medical state, threat detection, and claims of validated defense or safety performance"]
verification_routes = ["Future: CMake build and C++ unit/contract tests on supported Linux targets", "Future: schema compatibility and deterministic golden-fixture parity checks", "Future: collector and CWS read-only adapter integration tests; no experiment or deployment evidence is implied"]
